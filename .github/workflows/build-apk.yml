name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Web Assets
        run: |
          mkdir -p out
          if [ ! -f out/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>MEET</title><script>window.location.href="https://meet-azure.vercel.app";</script></head><body style="background:#2563EB;color:white;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;"><h1>MEET</h1></body></html>' > out/index.html
          fi
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MEET-v1.0.0-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEET-Android-APK
          path: build-output/MEET-v1.0.0-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: MEET v1.0.0 (MVP) — Android APK
          body: |
            ## MEET — People. Places. Experiences.
            **By ReGNL — Making Art Out Of Technology**
            
            ### 📱 Android Phone Installation
            Download and install `MEET-v1.0.0-debug.apk` directly on your Android phone.
            
            - **App Version:** v1.0.0 (MVP)
            - **Platform:** Android (Capacitor Native Shell)
            - **Package:** `com.regnl.meet`
            - **Target:** Android 8.0+ (API 26+)
          files: build-output/MEET-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
